map $http_srforgid $plm_srforgid {
    default $http_srforgid;
    000000 "";
}

map $http_srfuserid $modeling_srfuserid {
    default $http_srfuserid;
    ""      aibizhi;
}

map $http_srfusername $modeling_srfusername {
    default $http_srfusername;
    ""      aibizhi;
}

map $http_srforgcode $modeling_srforgcode {
    default $http_srforgcode;
    ""      000000;
}

# ModelDesign hosts a PLM-backed secondary-development workbench. Keep the
# service boundary explicit: only entities published by the PLM app route to
# ibizservicerunner; all other ModelDesign entities stay on modelingservice.
map $request_uri $modeling_api_upstream {
    default http://modelingservice:32002;
    ~^/api/ibizmodeling__modeldesign/(?:workspaces|ai_knowledge_sources|extend_scheduled_tasks|library_members|ai_kb_graph_entities|dictionary_data|resources|addons|psdeforms|role_members|templates|favorites|baseline_test_cases|psappportlets|deliverables|baseline_work_items|discuss_members|discuss_topics|managements|insight_members|discuss_replies|entries|products|run_attachments|extend_scheduled_task_his|ai_kb_tag_sets|ai_kb_members|tickets|stencils|ai_kb_search_results|workload_types|addon_role_members|search_hubs|departments|projects|runs|categories|ideas|run_histories|project_members|pssysbicubedimensions|ai_kb_document_wizards|idea_templates|ai_kb_search_queries|pscoreprdcats|pscoreprds|ai_agent_contexts|ai_agents|insight_views|ai_agent_sessions|openusers|roles|positions|relations|insight_reports|sprints|psdefields|transition_histories|review_wizards|work_item_types|pssysbicubemeasures|ai_kb_documents|baseline_ideas|references_indices|product_ticket_types|baseline_pages|project_tags|login_logs|ai_agent_messages|work_items|libraries|extend_logs|page_versions|notify_settings|ai_kb_graph_relations|psdelogics|product_members|boards|ai_tools|addon_resources|reviews|test_suites|review_content_ideas|portfolio_members|workloads|organizations|ai_agent_conversations|work_item_states|work_item_wizard_details|insights|space_members|activities|abouts|project_states|shared_spaces|test_plans|article_pages|product_tags|stages|groups|customers|ai_knowledge_bases|ai_agent_assignments|psdemslogics|jobs|ticket_types|search_attachments|auth_log_admins|pswfversions|msvalueproxies|members|parameters|versions|guidelines|ai_kb_tags|dyna_appmenus|review_contents|dyna_dashboards|discuss_posts|works|extend_print_templs|extend_task_types|pssysbireports|pscoreprdfuncs|pssysbicubes|psdenotifies|ai_credentials|extend_schedules|ai_models|ai_kb_chunks|ai_kb_graph_entity_types|template_flows|spaces|users|work_item_wizards|releases|search_comments|recents|portfolios|sections|test_cases|ai_runs|ai_run_steps|ai_run_events)(?:/|[?]|$) http://plmservice:30251;
}

map $modeling_api_upstream $modeling_api_service_prefix {
    default /ibizmodeling/modelapi;
    http://plmservice:30251 /ibizservicerunner/serviceapi;
}

map $modeling_api_upstream $modeling_api_system_id {
    default ibizmodeling;
    http://plmservice:30251 ibizplm;
}

server {
    listen       8080;
    server_name  localhost;

    # Resolve Compose service names per request so backend container recreation
    # does not leave Nginx pointing at an old container IP.
    resolver 127.0.0.11 ipv6=off valid=10s;
    set $uaa_upstream http://ibizlab-uaa-api:32666;
    set $allinone_upstream http://ibiz-ebsx-allinone:30000;
    set $plm_upstream http://plmservice:30251;
    set $modeling_upstream http://modelingservice:32002;
    set $modeling_plugins_upstream http://modeling-plugins:4175;

    location /modeldesign/ {
        alias  /dist/;
        index  index.html index.htm;
    }

    location ~ ^/modeldesign/doc/(.+\.md)$ {
        alias /dist/doc/$1;
        types {
            text/markdown md;
        }
    }

    # The 23 local modeling plugins are deployed as an independent sidecar.
    location = /modeling-plugins {
        return 302 /modeling-plugins/$is_args$args;
    }

    location = /modeling-plugins.html {
        return 302 /modeling-plugins/modeling-plugins.html$is_args$args;
    }

    # Keep these denials ahead of the sidecar proxy so private runtime files
    # cannot be exposed as static plugin assets.
    location = /modeling-plugins/server.mjs {
        return 404;
    }

    location = /modeling-plugins/plugin-manifest.json {
        return 404;
    }

    location ^~ /modeling-plugins/ {
        rewrite ^/modeling-plugins/(.*)$ /$1 break;
        proxy_pass $modeling_plugins_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_intercept_errors off;
        proxy_read_timeout 30s;
    }

    location = /api/modeling-plugins {
        return 404;
    }

    location ^~ /api/modeling-plugins/ {
        # Preserve Host (including its port) and Origin. The API remains loopback-only.
        proxy_pass $modeling_plugins_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_intercept_errors off;
        proxy_read_timeout 30s;
        client_max_body_size 2m;
    }

    # The local business services validate tokens against the allinone runtime.
    # Keep login on the same issuer so tokens minted here are accepted by both
    # PLM and ModelDesign service APIs.
    location ^~ /api/ibizmodeling__modeldesign/v7/ {
        rewrite ^/api/ibizmodeling__modeldesign/v7/(.*)$ /v7/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # plm-web uses its own application id for authentication. Keep the
    # authentication endpoints on UAA instead of sending them to plmservice.
    location ^~ /api/ibizplm__plmweb/v7/ {
        rewrite ^/api/ibizplm__plmweb/v7/(.*)$ /v7/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Content-Type      $http_content_type;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location ^~ /api/ibizmodeling__modeldesign/uaa/ {
        rewrite ^/api/ibizmodeling__modeldesign/uaa/(.*)$ /uaa/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /api/ibizmodeling__modeldesign/appdata {
        rewrite ^ /appdata break;
        proxy_pass $uaa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /api/ibizplm__plmweb/appdata {
        rewrite ^ /appdata break;
        proxy_pass $uaa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
    }

    location ^~ /api/ibizplm__plmweb/uaa/ {
        rewrite ^/api/ibizplm__plmweb/uaa/(.*)$ /uaa/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    location = /api/ibizplm__plmweb/extension/internal_messages/fetch_cur_receiver {
        add_header X-Total 0 always;
        default_type application/json;
        return 200 '[]';
    }

    location = /api/ibizplm__plmweb/extension/app_view_themes/fetch_cur_user_all {
        add_header X-Total 0 always;
        default_type application/json;
        return 200 '[]';
    }

    location ^~ /api/ibizplm__plmweb/configs/customtheme/ {
        default_type application/json;
        return 200 '';
    }

    location ^~ /api/ibizplm__plmweb/configs/menu/ {
        default_type application/json;
        return 200 '';
    }

    location ^~ /api/ibizplm__plmweb/configs/dynafilter/ {
        default_type application/json;
        return 200 '{}';
    }

    # plm-web sends business requests with its frontend application id, while
    # the local PLM service exposes them below /ibizservicerunner/serviceapi.
    location ^~ /api/ibizplm__plmweb/ {
        rewrite ^/api/ibizplm__plmweb/(.*)$ /ibizservicerunner/serviceapi/$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
    }

    # The secondary-development tab is hosted by ModelDesign, but its
    # workspace counter belongs to the PLM work_items entity. Keep this
    # compatibility route narrow so the rest of ModelDesign stays local.
    location ^~ /api/ibizmodeling__modeldesign/work_items/ {
        rewrite ^/api/ibizmodeling__modeldesign/(.*)$ /ibizservicerunner/serviceapi/$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
    }

    # Recent-use/access data is owned by the PLM service as well. ModelDesign
    # invokes it while opening the workbench and in secondary-development
    # pickers, so keep this compatibility route narrow and explicit.
    location ^~ /api/ibizmodeling__modeldesign/recents/ {
        rewrite ^/api/ibizmodeling__modeldesign/(.*)$ /ibizservicerunner/serviceapi/$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
    }

    location = /api/ibizmodeling__modeldesign/extension/internal_messages/fetch_cur_receiver {
        add_header X-Total 0 always;
        default_type application/json;
        return 200 '[]';
    }

    location = /api/ibizmodeling__modeldesign/extension/app_view_themes/fetch_cur_user_all {
        add_header X-Total 0 always;
        default_type application/json;
        return 200 '[]';
    }

    location ^~ /api/ibizmodeling__modeldesign/configs/customtheme/ {
        default_type application/json;
        return 200 '';
    }

    location ^~ /api/ibizmodeling__modeldesign/configs/menu/ {
        default_type application/json;
        return 200 '';
    }

    location ^~ /api/ibizmodeling__modeldesign/configs/dynafilter/ {
        default_type application/json;
        return 200 '{}';
    }

    # Platform dictionaries are served by allinone. Keep this before the
    # generic PLM service proxy so code lists do not become service 404s.
    location ^~ /api/ibizplm__plmweb/dictionaries/ {
        rewrite ^/api/ibizplm__plmweb/dictionaries/(.*)$ /dictionaries/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # No proxy headers are required for the static schema.
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
        proxy_set_header srfuserid         $modeling_srfuserid;
        proxy_set_header srfusername       $modeling_srfusername;
        proxy_set_header srforgcode        $modeling_srforgcode;
    }

    location ^~ /api/ibizmodeling__modeldesign/dictionaries/ {
        rewrite ^/api/ibizmodeling__modeldesign/dictionaries/(.*)$ /dictionaries/$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
        proxy_set_header srfuserid         $modeling_srfuserid;
        proxy_set_header srfusername       $modeling_srfusername;
        proxy_set_header srforgcode        $modeling_srforgcode;
    }

    location = /api/ibizmodeling__modeldesign/remotemodel/PSSYSAPP.hub.json {
        alias /app/model/PSSYSAPPS/plmweb/PSSYSAPP.json;
        default_type application/json;
    }

    location ^~ /api/ibizmodeling__modeldesign/remotemodel/ {
        # Serve model files as static files from the local model directory.
        # Strip API prefix and optional 'simple/' segment, then resolve
        # app-level models under PSSYSAPPS/plmweb/ with root fallback.
        rewrite "^/api/ibizmodeling__modeldesign/remotemodel/(simple/)?(.+)$" /$2 break;
        root /app/model;
        try_files /PSSYSAPPS/plmweb$uri $uri =404;
        default_type application/json;
    }

    # Dynamic form/search controls request entity JSON Schemas by name.
    location ^~ /api/ibizmodeling__modeldesign/jsonschema/ {
        rewrite ^/api/ibizmodeling__modeldesign/jsonschema/([A-Za-z0-9_]+)$ /PSSYSAPPS/plmweb/PSAPPDATAENTITIES/$1.jsonschema break;
        root /app/model;
        try_files $uri =404;
        default_type application/schema+json;
        add_header Cache-Control no-store;
    }

    # The schema is shipped with the mounted model bundle.
    location = /api/ibizmodeling__modeldesign/jsonschema/IDEA {
        alias /app/model/PSSYSAPPS/plmweb/PSAPPDATAENTITIES/IDEA.jsonschema;
        default_type application/schema+json;
    }

    location ^~ /api/ibizplm__plmweb/jsonschema/ {
        rewrite ^/api/ibizplm__plmweb/jsonschema/([A-Za-z0-9_]+)$ /PSSYSAPPS/plmweb/PSAPPDATAENTITIES/$1.jsonschema break;
        root /app/model;
        try_files $uri =404;
        default_type application/schema+json;
        add_header Cache-Control no-store;
    }

    # plm-web uses the same mounted schema after the product detail view opens.
    location = /api/ibizplm__plmweb/jsonschema/IDEA {
        alias /app/model/PSSYSAPPS/plmweb/PSAPPDATAENTITIES/IDEA.jsonschema;
        default_type application/schema+json;
    }

    # Portal open-data actions are provided by the shared allinone runtime.
    location ^~ /api/ibizmodeling__modeldesign/portal/markopendata/ {
        rewrite ^/api/ibizmodeling__modeldesign/(.*)$ /$1 break;
        proxy_pass $allinone_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $http_host;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
        proxy_set_header srfuserid         $modeling_srfuserid;
        proxy_set_header srfusername       $modeling_srfusername;
        proxy_set_header srforgcode        $modeling_srforgcode;
    }

    # ModelDesign business APIs default to modelingservice. The maps above
    # switch the published PLM entities to ibizservicerunner without changing
    # the frontend application id or its request shape.
    location ^~ /api/ibizmodeling__modeldesign/ {
        # Use a named capture here. The upstream-selection map is evaluated
        # before rewrite and can overwrite numbered captures, which would
        # otherwise drop the entity/action suffix.
        rewrite ^/api/ibizmodeling__modeldesign/(?<modeling_api_path>.*)$ $modeling_api_service_prefix/$modeling_api_path break;
        proxy_pass $modeling_api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header srfsystemid       $modeling_api_system_id;
        proxy_set_header srforgid          $plm_srforgid;
    }

    # Other local business APIs already contain their runtime deployment IDs.
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $plm_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_set_header Authorization     $http_authorization;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header srfsystemid       ibizplm;
        proxy_set_header srforgid          $plm_srforgid;
    }

    error_page   500 502 503 504  /50x.html;

    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
