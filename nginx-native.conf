server {
    listen 8080;
    server_name localhost;

    resolver 127.0.0.11 ipv6=off valid=10s;
    set $native_service http://modelingservice:32002;
    set $native_auth http://ibiz-ebsx-allinone:30000;
    set $native_uaa http://ibizlab-uaa-api:32666;

    location = /nativeappcode {
        return 302 /nativeappcode/$is_args$args;
    }

    location /nativeappcode/ {
        alias /dist/;
        index index.html;
    }

    location ^~ /api/nativeapicode/v7/ {
        rewrite ^/api/nativeapicode/v7/(.*)$ /v7/$1 break;
        proxy_pass $native_auth;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/nativeapicode/uaa/ {
        rewrite ^/api/nativeapicode/uaa/(.*)$ /uaa/$1 break;
        proxy_pass $native_auth;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/nativeapicode/appdata {
        rewrite ^ /appdata break;
        proxy_pass $native_uaa;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header srfsystemid ibizmodeling;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /api/nativeapicode/remotemodel/PSSYSAPP.hub.json {
        alias /app/model/PSSYSAPPS/nativeappmodel/PSSYSAPP.json;
        default_type application/json;
        add_header Cache-Control no-store;
    }

    location ^~ /api/nativeapicode/remotemodel/ {
        rewrite "^/api/nativeapicode/remotemodel/(simple/)?(.+)$" /$2 break;
        root /app/model;
        try_files /PSSYSAPPS/nativeappmodel$uri $uri =404;
        default_type application/json;
        add_header Cache-Control no-store;
    }

    location ^~ /api/nativeapicode/jsonschema/ {
        rewrite ^/api/nativeapicode/jsonschema/([A-Za-z0-9_]+)$ /PSSYSAPPS/nativeappmodel/PSAPPDATAENTITIES/$1.jsonschema break;
        root /app/model;
        try_files $uri =404;
        default_type application/schema+json;
    }

    location ^~ /api/nativeapicode/dictionaries/ {
        rewrite ^/api/nativeapicode/dictionaries/(.*)$ /dictionaries/$1 break;
        proxy_pass $native_auth;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header srfsystemid ibizmodeling;
    }

    location ^~ /api/nativeapicode/configs/ {
        rewrite ^/api/nativeapicode/configs/(.*)$ /configs/$1 break;
        proxy_pass $native_auth;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header srfsystemid ibizmodeling;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/nativeapicode/extension/ {
        rewrite ^/api/nativeapicode/extension/(.*)$ /extension/api/$1 break;
        proxy_pass $native_auth;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header srfsystemid ibizmodeling;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /api/nativeapicode/ {
        rewrite ^/api/nativeapicode/(.*)$ /ibizmodeling/modelapi/$1 break;
        proxy_pass $native_service;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header srfsystemid ibizmodeling;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
